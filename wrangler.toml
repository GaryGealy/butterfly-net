name = "butterfly-net"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
main = ".svelte-kit/cloudflare/_worker.js"

# Served at butterfly-net.<account-subdomain>.workers.dev.
workers_dev = true

# Accounts that can open /invites and aren't limited to the daily Claude allowance.
[vars]
ADMIN_EMAILS = "gary.m.gealy@gmail.com"
# Emails at these domains sign up without an invite (exact domain, unverified). The sign-up page
# still says invite-only; whoever shares the link tells people their company email works.
SIGNUP_DOMAINS = "teamsparq.com"

# Per client IP, keyed "<action>:<ip>" (login | signup | invite). Periods can only be 10 or 60 s,
# and counts are per Cloudflare location and approximate.
[[ratelimits]]
name = "AUTH_LIMITER"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 10
  period = 60

# Per normalized email: every login attempt for it.
[[ratelimits]]
name = "LOGIN_EMAIL_LIMITER"
namespace_id = "1002"
  [ratelimits.simple]
  limit = 20
  period = 60

[assets]
binding = "ASSETS"
directory = ".svelte-kit/cloudflare"

[[d1_databases]]
binding = "DB"
database_name = "butterfly-net-db"
database_id = "4752e933-eacc-42a8-b054-7987fece819a"
migrations_dir = "drizzle"
